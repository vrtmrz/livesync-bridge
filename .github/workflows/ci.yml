name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  deno-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.8

      - name: Install dependencies
        run: deno install --frozen

      - name: Check
        run: deno task check

      - name: Lint
        run: deno task lint

      - name: Test
        run: deno task test

      - name: Start CouchDB
        run: docker compose -f test/integration/compose.yml up --detach --wait

      - name: Test CouchDB integration
        run: deno task test:integration

      - name: Stop CouchDB
        if: always()
        run: docker compose -f test/integration/compose.yml down --volumes

  storage-watchers:
    name: Storage watcher (${{ matrix.os }}, ${{ matrix.backend }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2025]
        backend: [Deno.watchFs, Chokidar]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.8

      - name: Runtime version
        run: deno --version

      - name: Install dependencies
        run: deno install --frozen

      - name: Compare filesystem watchers
        run: deno task test:watcher --filter "${{ matrix.backend }}"
