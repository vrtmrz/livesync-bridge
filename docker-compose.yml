version: "2.1"
name: "obsidian-livesync-bridge"
services:
  bridge:
    build: .
    image: localhost/livesync-bridge:latest
    volumes:
      - ./data:/app/data
      - ./dat:/app/dat
      - bridge_local_storage:/deno-dir/location_data
    restart: unless-stopped

volumes:
  bridge_local_storage:
